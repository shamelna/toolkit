name: Deploy DOE Navigator

on:
  push:
    paths:
      - 'DOE-navigator/**'
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: DOE-navigator/package-lock.json
        
    - name: Install dependencies
      run: |
        cd DOE-navigator
        npm ci
        
    - name: Build DOE Navigator
      run: |
        cd DOE-navigator
        npm run build
        
    - name: Create deployment directory
      run: |
        mkdir -p toolkit/DOE-Navigator
        
    - name: Copy built files
      run: |
        cp -r DOE-navigator/dist/* toolkit/DOE-Navigator/
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add toolkit/DOE-Navigator/
        git diff --staged --quiet || git commit -m "Auto-update DOE Navigator build"
        git push
